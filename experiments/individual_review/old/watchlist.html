<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prominent donor identity review</title>
<style>
:root{font-family:Inter,Segoe UI,system-ui,sans-serif;color:#192b31;background:#f4f3ed;font-size:15px}*{box-sizing:border-box}body{margin:0}header{padding:28px 36px;background:#183d3b;color:#fff}header h1{margin:5px 0 10px;font-size:29px;font-weight:600}header p{max-width:1050px;line-height:1.5;margin:8px 0;color:#d3e5df}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#b5d4c9}.layout{display:grid;grid-template-columns:265px 1fr;max-width:1600px;margin:auto}aside{padding:24px 16px;border-right:1px solid #d9ddd5}main{min-width:0;padding:28px}button,input,select,textarea{font:inherit}button,select,input,textarea{border:1px solid #c7d1ca;border-radius:5px;background:white;padding:9px}button{cursor:pointer}button:hover{background:#edf3ed}button.active{background:#d9ebe2;border-color:#336a59}.person{display:block;width:100%;text-align:left;margin:6px 0;padding:12px}.person small{display:block;color:#52665e;margin-top:5px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:#fff;border:1px solid #d7dfd7;padding:14px 20px;border-radius:7px;min-width:145px}.stat b{display:block;font-size:25px;font-weight:600}.stat span{font-size:12px;color:#596c65}.sources,.scope{padding:16px 20px;background:#e7eee6;border-radius:6px;line-height:1.5;margin:16px 0}.sources a{display:block;margin:6px 0}a{color:#12614f}h2{margin:0;font-size:25px}h3{font-size:17px;margin:0 0 10px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:24px 0 12px}#search{flex:1;min-width:180px}.group{background:#fff;border:1px solid #d8dfd7;border-radius:7px;margin:12px 0;padding:20px}.group-head{display:flex;justify-content:space-between;gap:20px}.badge{font-size:11px;letter-spacing:.5px;border-radius:20px;padding:6px 11px;display:inline-block;background:#e8ece9;color:#40524b;height:fit-content;white-space:nowrap}.accepted{background:#d8eddf;color:#205c38}.rejected{background:#f3dfdc;color:#81372e}.unresolved,.unreviewed,.stale{background:#fbebc9;color:#78550d}.meta{color:#60716a;line-height:1.7;font-size:13px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.facts div{padding:11px;background:#f5f7f3;border-radius:4px}.label{font-size:11px;display:block;color:#69796f;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}.rationale{line-height:1.6;border-left:3px solid #789883;padding-left:14px}.rationale p{margin:9px 0}details{margin-top:14px}summary{cursor:pointer;color:#305749}table{border-collapse:collapse;width:100%;font-size:12px;margin-top:12px}th,td{border-bottom:1px solid #e4e9e2;padding:8px;text-align:left;vertical-align:top}.scroll{overflow-x:auto}code{font-size:11px;overflow-wrap:anywhere}form{background:#f1f5ef;padding:15px;margin-top:12px}form label{display:block;margin:10px 0 5px}form textarea{display:block;width:100%;min-height:68px}form input{width:100%}.save{background:#1d5e48;color:white;margin-top:15px}.save:hover{background:#184d3b}.muted{color:#68786f;font-size:13px}.empty{padding:50px;color:#596b62;text-align:center}.page-controls{display:flex;justify-content:space-between;margin:20px 0}footer{font-size:12px;color:#66746c;padding:24px 0}.criteria{white-space:pre-line}.no-js{padding:40px}@media(max-width:800px){header{padding:22px}.layout{grid-template-columns:1fr}aside{border:0;display:flex;overflow:auto;gap:8px;padding:12px}aside .person{min-width:190px}main{padding:18px}.facts{grid-template-columns:1fr}.group-head{gap:8px}h2{font-size:22px}}
</style>
</head>
<body>
<header><div class="eyebrow">Tech Money · research workspace</div><h1>Prominent donor identity review</h1><p>20 people. Decisions tied to specific filing evidence. Open a person to inspect accepted matches, rejected candidates, unresolved cases, and the criteria behind each decision.</p><p id="coverage"></p></header>
<noscript><p class="no-js">Enable JavaScript to inspect the review. Per-person Markdown dossiers and CSV mappings are also included alongside this file.</p></noscript>
<div class="layout"><aside id="people" aria-label="Choose a person"></aside><main id="main"></main></div>
<script>
const DATA=/*REVIEW_DATA*/{};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const decisionMap=new Map(DATA.decisions.map(d=>[d.person_id+'|'+d.group_id,d]));
let active=DATA.people.find(p=>p.person_id===location.hash.slice(1))?.person_id||DATA.people[0].person_id,page=0,filter='all',query='';
const PAGE_SIZE=35;
const decision=g=>decisionMap.get(active+'|'+g.group_id);
const state=g=>DATA.review_states[active+'|'+g.group_id]||'unreviewed';
const stat=(n,label)=>`<div class="stat"><b>${n.toLocaleString()}</b><span>${label}</span></div>`;
document.getElementById('coverage').textContent='Cycles '+DATA.manifest.cycles.join(' and ')+' · Local source snapshots · Agent-assisted decisions are labeled · Identity annotations do not change published totals';
function sidebar(){document.getElementById('people').innerHTML=DATA.summary.map(p=>`<button class="person ${p.person_id===active?'active':''}" data-person="${p.person_id}">${esc(p.display_name)}<small>${p.accepted_records.toLocaleString()} linked records · ${p.unresolved+p.unreviewed+p.stale} open groups</small></button>`).join('');document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{active=b.dataset.person;location.hash=active;page=0;filter='all';query='';render()})}
function groupCard(g){const d=decision(g),s=state(g),person=DATA.people.find(p=>p.person_id===active);return `<article class="group"><div class="group-head"><div><h3>${esc(g.name)}</h3><div class="meta">${esc(g.city)}, ${esc(g.state)} · ZIP ${esc(g.zip_code)} · ${g.cycle} cycle<br>${g.record_count} source records · ${esc(g.date_min||'unknown date')} – ${esc(g.date_max||'unknown date')}</div></div><span class="badge ${s}">${s.toUpperCase()}</span></div><div class="facts"><div><span class="label">Reported employer</span>${esc(g.employer||'(missing)')}</div><div><span class="label">Reported occupation</span>${esc(g.occupation||'(missing)')}</div></div><div class="rationale">${d?`<p><strong>Decision basis.</strong> ${esc(d.rationale)}</p><p><strong>Evidence.</strong> ${esc(d.support)}</p><p><strong>Limits / conflicting evidence.</strong> ${esc(d.limitations)}</p><p class="muted">Criteria: ${esc(d.criteria.join(', '))} · Reviewer: ${esc(d.reviewer)} · ${esc(d.reviewed_at)}</p><p class="muted">Sources: ${d.source_ids.map(id=>{const src=DATA.people.flatMap(p=>p.sources).find(s=>s.source_id===id);return src?`<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.title)}</a>`:esc(id)}).join(' · ')}</p>`:'<p>No decision recorded. Retrieval similarity is not an identity match.</p>'}</div><details><summary>Inspect ${g.record_count} underlying FEC records</summary><p class="muted">Amounts are as reported. Memos, refunds, amendments and repeats remain present; this is not a giving total.</p><div class="scroll"><table><thead><tr><th>Date</th><th>Amount</th><th>Committee</th><th>Type / memo</th><th>Filing reference</th><th>Record ID</th></tr></thead><tbody>${g.records.map(r=>`<tr><td>${esc(r.date||r.transaction_dt)}</td><td>${esc(r.transaction_amt)}</td><td>${esc(r.cmte_id)}</td><td>${esc(r.transaction_tp)} ${esc(r.memo_cd)}<br>${esc(r.memo_text)}</td><td>${r.filing_url?`<a href="${esc(r.filing_url)}" target="_blank" rel="noopener">Original filing</a>`:'No image link'}<br>${esc(r.file_num)} / ${esc(r.tran_id)}</td><td><code>${esc(r.record_id)}</code></td></tr>`).join('')}</tbody></table></div><p class="muted">Group <code>${g.group_id}</code><br>Evidence SHA-256 <code>${g.evidence_sha256}</code></p></details><details><summary>Record a review or revise this decision</summary><p class="muted">Saving requires the local review server. A revision appends to the audit history. Source changes invalidate prior decisions.</p><form data-group="${g.group_id}"><label>Decision</label><select name="decision"><option value="unresolved">Unresolved</option><option value="accepted">Accepted</option><option value="rejected">Rejected</option></select><label>Reviewer</label><input name="reviewer" required placeholder="Your name"><label>Criteria (comma separated)</label><input name="criteria" required value="${esc(d?.criteria.join(', ')||'U1')}"><label>Decision basis</label><textarea name="rationale" required>${esc(d?.rationale||'')}</textarea><label>Supporting evidence</label><textarea name="support" required>${esc(d?.support||'')}</textarea><label>Limits or conflicting evidence</label><textarea name="limitations" required>${esc(d?.limitations||'')}</textarea><label>Source IDs (comma separated)</label><input name="source_ids" value="${esc(d?.source_ids.join(', ')||person.sources.map(s=>s.source_id).join(', '))}"><button class="save" type="submit">Save audited decision</button><p class="message" role="status"></p></form></details></article>`}
function cards(){const all=DATA.groups.filter(g=>g.candidate_people[active]);const selected=all.filter(g=>(filter==='all'||state(g)===filter)&&(!query||[g.name,g.city,g.state,g.zip_code,g.employer,g.occupation,decision(g)?.rationale].join(' ').toLowerCase().includes(query.toLowerCase())));const max=Math.max(0,Math.ceil(selected.length/PAGE_SIZE)-1);page=Math.min(page,max);document.getElementById('results').innerHTML=selected.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE).map(groupCard).join('')||'<div class="empty">No evidence groups match this filter.</div>';document.getElementById('paging').innerHTML=`<button id="prev" ${page===0?'disabled':''}>Previous</button><span>${selected.length} groups · Page ${page+1} of ${max+1}</span><button id="next" ${page===max?'disabled':''}>Next</button>`;document.getElementById('prev').onclick=()=>{page--;cards()};document.getElementById('next').onclick=()=>{page++;cards()};document.querySelectorAll('form[data-group]').forEach(form=>{const g=all.find(g=>g.group_id===form.dataset.group),d=decision(g);form.elements.decision.value=d?.decision||'unresolved';form.onsubmit=async e=>{e.preventDefault();const msg=form.querySelector('.message');if(location.protocol==='file:'){msg.textContent='Start app.py --watchlist --port 8766 and open http://127.0.0.1:8766/ to save.';return}const fields=Object.fromEntries(new FormData(form));for(const k of ['criteria','source_ids'])fields[k]=fields[k].split(',').map(x=>x.trim()).filter(Boolean);try{const res=await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...fields,person_id:active,group_id:g.group_id,evidence_sha256:g.evidence_sha256,person_context_sha256:g.person_context_sha256[active],anchor_refs:fields.criteria.includes('N1_L1_T1')?(d?.anchor_refs||[]):[]})});const body=await res.json();if(!res.ok)throw Error(body.error);msg.textContent='Saved. Reloading the audited review.';location.reload()}catch(err){msg.textContent=err.message}}})}
function render(){sidebar();const p=DATA.people.find(p=>p.person_id===active),s=DATA.summary.find(p=>p.person_id===active);document.getElementById('main').innerHTML=`<div class="eyebrow" style="color:#476959">${p.person_id} · public-person dossier</div><h2>${esc(p.display_name)}</h2><div class="stats">${stat(s.accepted_records,'accepted source records')}${stat(s.accepted,'accepted evidence groups')}${stat(s.unresolved+s.unreviewed+s.stale,'open evidence groups')}${stat(s.rejected,'rejected candidate groups')}</div><div class="scope"><strong>Person-specific review judgment</strong><p>${esc(DATA.profiles[p.person_id]?.review_note||'No profile note recorded.')}</p></div><div class="sources"><strong>Identity and collision sources</strong>${p.sources.map(src=>`<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.title)}</a><div class="muted">${esc(src.claim)} Source observed ${esc(src.accessed)}.</div>`).join('')}</div><details class="scope"><summary>Review criteria and coverage</summary><p class="criteria">N1_E1_O1: compatible name, specifically sourced affiliation, and compatible reported role.
N1_L1_T1: compatible name plus an explicitly cited accepted anchor with matching full reported name, city, state, full nine-digit ZIP, and every record within 90 days in the same cycle. Never automatic transitive clustering.
R1: unsupported given-name variant; R2: organization/non-person record; R3: substantive professional conflict; R4: independently corroborated namesake; U1: insufficient corroboration; U2: conflicting or unsupported middle/suffix, role, employer or time context.
An accepted decision covers only this exact set of source-record hashes. No blanket acceptance of a surname, alias, household, employer, or future record.</p><p class="muted">Search surnames: ${esc(p.search_surnames.join(', '))}. Given-name hypotheses: ${esc(p.search_given_names.join(', '))}. Retrieval also includes initial-only given names and one-edit given-name hypotheses. Changed surnames, unlisted surname typos, omitted surnames, and unitemized giving remain outside this search. Sources establish public identity; FEC fields remain filer-reported.</p></details><div class="toolbar"><label for="filter">Show</label><select id="filter"><option value="all">All decisions</option>${['accepted','unresolved','rejected','unreviewed','stale'].map(s=>`<option value="${s}">${s}</option>`).join('')}</select><input id="search" aria-label="Search evidence" placeholder="Search name, employer, location, or decision basis"></div><div id="results"></div><div id="paging" class="page-controls"></div><footer>Local research artifact · Dates, filings and record hashes retained · No inferred party preference used for identity matching · No changes to production totals</footer>`;document.getElementById('filter').value=filter;document.getElementById('filter').onchange=e=>{filter=e.target.value;page=0;cards()};document.getElementById('search').value=query;document.getElementById('search').oninput=e=>{query=e.target.value;page=0;cards()};cards()}
render();
</script>
</body></html>
