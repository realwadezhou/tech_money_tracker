const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=s=>`<span class="badge ${esc(s)}">${esc(s)}</span>`;
let person=DATA.people.find(p=>p.person_id===location.hash.slice(1))?.person_id||DATA.people[0].person_id,query='',filter='all',page=0;
const status=c=>DATA.reviews[c.case_id]?.decision||'unreviewed';
function render(){
 document.getElementById('people').innerHTML=DATA.summary.map(s=>`<button class="person ${s.person_id===person?'active':''}" data-person="${s.person_id}">${esc(s.name)}<small>${s.cases} cases · ${s.accepted_records} linked records</small></button>`).join('');
 document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{person=b.dataset.person;location.hash=person;query='';filter='all';page=0;render()});
 const p=DATA.people.find(p=>p.person_id===person),s=DATA.summary.find(s=>s.person_id===person),cases=DATA.cases.filter(c=>c.person_id===person),review=cases.map(c=>DATA.reviews[c.case_id]).find(Boolean);
 const count=(v,l)=>`<div class="stat"><b>${v.toLocaleString()}</b><small>${l}</small></div>`;
 document.getElementById('main').innerHTML=`<div class="eyebrow">${esc(p.person_id)}</div><h2>${esc(p.display_name)}</h2><div class="stats">${count(s.records,'candidate records')}${count(s.cases,'review cases')}${count(s.accepted_records,'linked records')}${count((s.reviewed.unresolved||0)+(s.reviewed.unreviewed||0)+(s.reviewed.stale||0),'open cases')}</div><div class="note"><strong>Contextual review</strong><p>${esc(review?.person_note||'No contextual review has been recorded yet.')}</p><div class="muted">${esc(review?.reviewer||'')} ${esc(review?.reviewed_at||'')}</div></div><details><summary>Person profile and sources</summary><p>${esc(p.profile_note)}</p><p><strong>Names:</strong> ${esc(p.given_names.join(' / '))} ${esc(p.surname)}. Middle names: ${esc(p.middle_names.join(', ')||'(no full form recorded)')}. Initials: ${esc(p.middle_initials.join(', ')||'(none recorded)')}. Suffixes: ${esc(p.suffixes.join(', ')||'(none recorded)')}.</p><p><strong>Plausible geography:</strong> ${esc(p.plausible_locations.map(l=>l.states.join('/')+'; '+Object.values(l.cities).flat().join('/')).join(' · ')||'No independently established location list; unlisted locations remain neutral.')}</p><p><strong>Career affiliations:</strong> ${esc(p.affiliations.map(a=>a.label).join(', '))}</p><p class="muted">Name distinctiveness contributes ${p.distinctiveness_points} points. This is a profile hypothesis, not a measured population frequency.</p>${p.source_ids.map(id=>{const src=DATA.sources[id];return src?`<div class="source">${src.url?`<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.title)}</a>`:`<strong>${esc(src.title)}</strong>`}<div class="muted">${esc(src.claim)}</div></div>`:''}).join('')}</details><details><summary>How to read the score and calibration</summary><p>Name, geography and career are evidence families. Location alternatives use their best match. City, state and ZIP do not count as three votes. Missing or generic occupation adds zero points; a documented namesake subtracts 12. Scores of 8 or more suggest acceptance only if no conflict or review flag is present.</p><p>“2/2 observed, 1 missing” is a field-coverage summary, not 100% confidence. The contextual review can override a suggestion and records why.</p><p class="muted">Calibration currently covers development examples supplied or prompted by the user: Musk and the Venable attorney. These informed the profiles; independent holdout accuracy is not yet measured.</p></details><div class="toolbar"><input id="search" aria-label="Search evidence" placeholder="Search name, employer, occupation or location"><select id="filter" aria-label="Filter review cases"><option value="all">All cases</option><option value="accept">Accepted</option><option value="reject">Rejected</option><option value="unresolved">Unresolved</option><option value="unreviewed">Unreviewed</option><option value="overrides">Review overrides</option></select></div><div id="results"></div><div id="pager" class="pager"></div><footer>Each case groups the same review question. Unresolved records in one case are not assumed to belong to one person. Counts refer to source records, not distinct gifts. Raw fields, refunds and memo records are preserved.</footer>`;

 document.getElementById('filter').value=filter;document.getElementById('filter').onchange=e=>{filter=e.target.value;page=0;table()};table();
}
function table(){
 const cases=DATA.cases.filter(c=>c.person_id===person).filter(c=>(filter==='all'||status(c)===filter||(filter==='overrides'&&DATA.reviews[c.case_id]&&status(c)!==({review:'unresolved'}[c.evidence.recommendation]||c.evidence.recommendation)))&&JSON.stringify([c.names,c.locations,c.careers]).toLowerCase().includes(query.toLowerCase()));
 const max=Math.max(0,Math.ceil(cases.length/25)-1);page=Math.min(page,max);
 document.getElementById('results').innerHTML=cases.length?`<div class="tablewrap"><table><thead><tr><th>Reported context</th><th>Records</th><th>Score / coverage</th><th>Suggested</th><th>Reviewed</th><th></th></tr></thead><tbody>${cases.slice(page*25,page*25+25).map(c=>{const e=c.evidence;return `<tr><td class="name"><strong>${esc(c.names.slice(0,2).join(' / '))}</strong>${c.names.length>2?` <span class="muted">+${c.names.length-2} variants</span>`:''}<span class="sub">${esc(c.locations.slice(0,3).join(' · '))}${c.locations.length>3?' …':''}</span><span class="sub">${esc(c.careers.slice(0,2).map(w=>w.map(x=>x||'(blank)').join(' / ')).join(' · '))}${c.careers.length>2?' …':''}</span></td><td>${c.record_count}</td><td><span class="score">${e.score}</span><span class="sub">${e.support_count}/${e.observed_count} supportive/observed<br>${e.missing_count} missing · ${e.conflict_count} conflicts</span></td><td>${badge(e.recommendation)}</td><td>${badge(status(c))}</td><td><button data-expand="${c.case_id}" aria-expanded="false">Details</button></td></tr><tr class="detail" id="${c.case_id}" hidden><td colspan="6"></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No cases match this filter.</div>';
 document.getElementById('pager').innerHTML=`<button id="prev" ${page===0?'disabled':''}>Previous</button><span class="counter">${cases.length} cases · Page ${page+1} of ${max+1}</span><button id="next" ${page===max?'disabled':''}>Next</button>`;
 document.getElementById('prev').onclick=()=>{page--;table()};document.getElementById('next').onclick=()=>{page++;table()};
 document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{const c=DATA.cases.find(c=>c.case_id===b.dataset.expand),row=document.getElementById(c.case_id);row.hidden=!row.hidden;b.setAttribute('aria-expanded',String(!row.hidden));if(!row.hidden)detail(c,row.firstElementChild)});
}
function detail(c,container){const e=c.evidence,r=DATA.reviews[c.case_id];container.innerHTML=`<div class="signals">${Object.entries(e.signals).map(([key,s])=>`<div class="signal"><strong>${esc(key)} ${s.points>0?'+':''}${s.points}</strong><div class="muted">${esc(s.level.replaceAll('_',' '))}</div></div>`).join('')}</div><p><strong>Review basis:</strong> ${esc(r?.note||'Awaiting contextual review.')}</p>${c.cohort_context?`<p><strong>Observed cohort support:</strong> ${c.cohort_context.zip9_records}/${c.record_count} records share city, state and a nine-digit postal code with a strong affiliation case; ${c.cohort_context.zip5_records}/${c.record_count} share the five-digit postal area. This is context, not a separate score or identity proof.<br><span class="muted">Supporting cases: ${esc(c.cohort_context.supporting_case_ids.join(', '))}</span></p>`:''}<p><strong>Flags:</strong> ${esc(e.flags.join(', ')||'none')}. <strong>Conflicts:</strong> ${esc(e.conflicts.join(', ')||'none')}.</p><p><strong>Names:</strong> ${esc(c.names.join(' · '))}<br><strong>Places:</strong> ${esc(c.locations.join(' · '))}<br><strong>Reported work:</strong> ${esc(c.careers.map(w=>w.map(x=>x||'(blank)').join(' / ')).join(' · '))}</p><p class="muted">${esc(c.date_min)} to ${esc(c.date_max)} · Cycles ${esc(c.cycles.join(', '))}<br>Case ${esc(c.case_id)} · Review ${esc(r?.review_id||'pending')} · ${esc(r?.scope||'')}</p><button class="records">Load ${c.record_count} original records</button><div class="raw"></div>`;container.querySelector('.records').onclick=async()=>{const target=container.querySelector('.raw');if(location.protocol==='file:'){target.textContent='For individual records, run run.py serve and open the localhost review URL. The raw snapshot is in data/records.jsonl.';return}try{const res=await fetch('/api/case/'+encodeURIComponent(c.case_id));if(!res.ok)throw Error('Could not load records');const rows=await res.json();target.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Record</th><th>Name / location</th><th>Employer / occupation</th><th>Date / amount</th><th>Filing</th></tr></thead><tbody>${rows.map(x=>`<tr><td><code>${esc(x.record_id)}</code></td><td>${esc(x.name)}<br>${esc(x.city)}, ${esc(x.state)} ${esc(x.zip_code)}</td><td>${esc(x.employer)}<br>${esc(x.occupation)}</td><td>${esc(x.transaction_dt)}<br>${esc(x.transaction_amt)}<br>${esc(x.transaction_tp)} / ${esc(x.memo_cd)}</td><td>${x.image_num?`<a href="https://docquery.fec.gov/cgi-bin/fecimg/?${encodeURIComponent(x.image_num)}" target="_blank" rel="noopener">Original filing</a>`:'No image'}<br>${esc(x.cmte_id)}<br>${esc(x.tran_id)}</td></tr>`).join('')}</tbody></table></div>`}catch(err){target.textContent=err.message}}}
render();
